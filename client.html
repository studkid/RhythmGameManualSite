<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Rhythm Game Client</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="client.css">
</head>

<body>
    <table style="width: 100%;">
        <tr>
            <td><textarea id="log" disabled="true" rows="15" style="width: 100%; resize: vertical;"></textarea></td>
        </tr>
        <tr>
            <td>
                <label for="chat">Chat</label>
                <input type="text" id="hostname" name="chat" value="" style="width: 100%;"><br>
                <p id="tracker">X/Y Map Progress to Goal</p>
            </td>
        </tr>
        <tr>
            <td>
            <table id="locations" style="width: 100%; border: 1px solid;">
            <tr style="width: 100%;">
                <th id="sortName">Name</th>
                <th id="sortVer">Version</th>
                <th id="sortCat">Category</th>
                <th>Difficulties</th>
            </tr>
            <tr id="goalEntry">
                <td class="locEntry"><button disabled="true" id="goal" style="width: 100%;">Goal</button></td>
                <td class="locEntry" id="goalVer"></td>
                <td class="locEntry" id="goalCat"></td>
                <td class="locEntry" id="goalDiff"></td>
            </tr>
            </td>
        </table>
        </tr>
    </table>

    <script type="module" src="client.js"></script>
</body>
</html>
